name: Build and integration test

on:
  push:
  pull_request:
  # Reused by release.yml so images are only published after these tests pass.
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Session and sign-in unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build single-container registry
        run: docker build -t registreasy:test .
      - name: Permissions, push and pull
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-data
          docker run -d --name registreasy-ci \
            -p 127.0.0.1:15000:5000 \
            -e PUSH_PASSWORD=test-push-password \
            -e PULL_PASSWORD=test-pull-password \
            -v "$PWD/.ci-data:/data" \
            registreasy:test
          for i in {1..30}; do
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15000/v2/)" == 401 ]]; then break; fi
            sleep 1
          done
          PUSH_PASSWORD=test-push-password PULL_PASSWORD=test-pull-password \
            bash tests/smoke.sh http://127.0.0.1:15000
          # The registry refuses to start without both passwords.
          if docker run --rm -e PUSH_PASSWORD=x registreasy:test; then
            echo "ERROR: started without PULL_PASSWORD" >&2
            exit 1
          fi
          docker pull alpine:3.20
          # Pull user: may log in, may not push. Use a repository that does not
          # exist yet: re-pushing a known image can "succeed" via HEAD checks alone.
          docker tag alpine:3.20 localhost:15000/test/readonly-check:ci
          printf '%s\n' test-pull-password | docker login localhost:15000 -u pull --password-stdin
          if docker push localhost:15000/test/readonly-check:ci; then
            echo "ERROR: pull user was able to push" >&2
            exit 1
          fi
          docker logout localhost:15000
          # Publisher pushes, then the pull user pulls the same image.
          docker tag alpine:3.20 localhost:15000/test/alpine:ci
          printf '%s\n' test-push-password | docker login localhost:15000 -u push --password-stdin
          docker push localhost:15000/test/alpine:ci
          docker logout localhost:15000
          docker rmi localhost:15000/test/alpine:ci
          printf '%s\n' test-pull-password | docker login localhost:15000 -u pull --password-stdin
          docker pull localhost:15000/test/alpine:ci
          docker logout localhost:15000
          sleep 21  # inventory cache from the smoke test
          curl -fsS http://127.0.0.1:15000/healthz | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="ok" and x["storage"]["writable"]'
          curl -fsS http://127.0.0.1:15000/ | grep -q 'id="signin-form"'
          curl -fsS http://127.0.0.1:15000/inventory.js | grep -q 'function render'
          curl -fsS -u pull:test-pull-password http://127.0.0.1:15000/api/inventory | python3 -c '
          import json, sys
          x = json.load(sys.stdin)
          assert x["can_delete"] is False
          assert any(t["tag"] == "ci" and t["tag_updated_at"] for r in x["repositories"] if r["name"] == "test/alpine" for t in r["tags"]), x
          assert not any(r["name"] == "test/readonly-check" for r in x["repositories"]), x
          '

      - name: Delete API
        shell: bash
        run: |
          set -euo pipefail
          api() {  # api <json> [curl args...] -> prints body, then HTTP status on the last line
            local body="$1"; shift
            curl -sS -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' \
              -H 'X-Registreasy-Action: delete' -d "$body" "$@" "http://127.0.0.1:15000/api/delete"
          }
          # Only the publisher may delete, and only with the action header.
          test "$(api '{"repo":"test/alpine","tag":"ci"}' | tail -1)" = 401
          test "$(api '{"repo":"test/alpine","tag":"ci"}' -u pull:test-pull-password | tail -1)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -u push:test-push-password \
            -H 'Content-Type: application/json' -d '{"repo":"test/alpine"}' http://127.0.0.1:15000/api/delete)" = 403
          # Preview, stale confirmation, then a real delete.
          preview="$(api '{"repo":"test/alpine","tag":"ci","preview":true}' -u push:test-push-password)"
          test "$(tail -1 <<<"$preview")" = 200
          plan_id="$(head -n -1 <<<"$preview" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["preview"] and not x["deleted"] and x["tags"]==["ci"]; print(x["plan_id"])')"
          stale="$(printf '0%.0s' {1..64})"
          test "$(api "{\"repo\":\"test/alpine\",\"tag\":\"ci\",\"plan_id\":\"$stale\"}" -u push:test-push-password | tail -1)" = 409
          test "$(api "{\"repo\":\"test/alpine\",\"tag\":\"ci\",\"plan_id\":\"$plan_id\"}" -u push:test-push-password | tail -1)" = 200
          sleep 1
          curl -fsS -u push:test-push-password http://127.0.0.1:15000/api/inventory | python3 -c '
          import json, sys
          x = json.load(sys.stdin)
          assert x["can_delete"] is True
          assert not any(t["tag"] == "ci" for r in x["repositories"] if r["name"] == "test/alpine" for t in r["tags"]), x
          '

      - name: Diagnostics
        if: always()
        run: |
          docker logs registreasy-ci || true
          docker rm -f registreasy-ci || true
