name: Release image

# Publishing a GitHub release tagged vMAJOR.MINOR.PATCH (e.g. v0.1.0, or a
# pre-release such as v0.2.0-rc.1) builds the image and pushes it to
# ghcr.io/<owner>/<repo>. Integration tests must pass first.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a vX.Y.Z release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not in vMAJOR.MINOR.PATCH form (e.g. v0.1.0)"
            exit 1
          fi

  test:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 -> 0.1.0, 0.1 (and 0 once >= 1.0.0); `latest` only for
          # non-prerelease releases. Pre-releases get only their full version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') }}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Registreasy
            org.opencontainers.image.description=Single-container Docker registry with read-only and publisher accounts on one endpoint

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
