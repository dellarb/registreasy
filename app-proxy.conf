# Included by every location served by inventory.py (loopback only).
# The X-Registreasy-* headers are always overwritten here, so clients cannot
# forge them; the app trusts them for client address and transport scheme.
proxy_pass http://127.0.0.1:5003;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Registreasy-Client $remote_addr;
proxy_set_header X-Registreasy-Private $registreasy_client_private;
proxy_set_header X-Registreasy-Scheme $registreasy_scheme;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Host "";
