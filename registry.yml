version: 0.1

log:
  level: info

storage:
  filesystem:
    rootdirectory: /data
  delete:
    # Enabled for the publish-only delete UI/API (inventory.py). Clients can
    # still only reach DELETE via the publish listener, which requires push login.
    enabled: true

# Nginx is the only public listener. No debug/metrics listener is enabled.
http:
  addr: 127.0.0.1:5001
  headers:
    X-Content-Type-Options: [nosniff]
