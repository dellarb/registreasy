version: 0.1

log:
  level: info

storage:
  filesystem:
    rootdirectory: /data
  delete:
    # Enabled for the publisher-only delete UI/API (inventory.py). Nginx only
    # lets the push account send DELETE (or any write) to /v2/.
    enabled: true

# Nginx is the only public listener. No debug/metrics listener is enabled.
http:
  addr: 127.0.0.1:5001
  headers:
    X-Content-Type-Options: [nosniff]
