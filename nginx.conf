worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $http_x_forwarded_proto $registry_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Password-checking API routes share one throttle (not per client:
    # behind a TLS proxy every request shares the proxy's address). This caps
    # password guessing and bcrypt load; Docker pulls/pushes on /v2/ are untouched.
    limit_req_zone $server_port zone=registreasy_api:1m rate=10r/s;
    limit_req_status 429;

    # Generated by entrypoint.sh: maps $remote_user to anon / push / other.
    include /etc/nginx/registreasy-users.conf;

    # Only the publisher may write. Anonymous requests fall through to
    # auth_basic (401 challenge); any other named user gets 403 on writes.
    # auth_basic still verifies the publisher's password after this check.
    map "$request_method:$registreasy_role" $registreasy_deny_write {
        default            1;
        "~^(GET|HEAD):"    0;
        "~:(anon|push)$"   0;
    }

    # Single endpoint: every route needs the pull or push account.
    server {
        listen 5000;
        server_name _;
        client_max_body_size 0;

        # Always challenge at /v2/ so Docker sends credentials on pushes.
        location /v2/ {
            auth_basic "Registreasy";
            auth_basic_user_file /run/registreasy/users.htpasswd;
            if ($registreasy_deny_write) {
                return 403;
            }
            include /etc/nginx/registry-proxy.conf;
        }

        # Health reporting is deliberately available to unauthenticated monitors.
        location = /healthz {
            proxy_pass http://127.0.0.1:5003/healthz;
        }

        # Landing page and assets are public. The API routes check credentials
        # in inventory.py (no WWW-Authenticate header), so browsers show the
        # page's sign-in form rather than a native Basic-auth popup.
        location = / {
            proxy_pass http://127.0.0.1:5003/;
        }
        location = /inventory.js {
            proxy_pass http://127.0.0.1:5003/inventory.js;
        }
        location = /inventory.css {
            proxy_pass http://127.0.0.1:5003/inventory.css;
        }
        location = /api/inventory {
            limit_req zone=registreasy_api burst=20 nodelay;
            proxy_pass http://127.0.0.1:5003/api/inventory;
        }
        location = /api/delete {
            limit_except POST { deny all; }
            limit_req zone=registreasy_api burst=20 nodelay;
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:5003/api/delete;
        }

        location / {
            return 404;
        }
    }
}
