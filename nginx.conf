worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    # --- Who is the client, and did they use HTTPS? -------------------------
    # Reverse proxies (Caddy, NPM, Traefik...) normally run on a private address.
    # Only a private-address peer may tell us the real client (X-Forwarded-For)
    # and scheme (X-Forwarded-Proto). A public peer cannot forge either.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The direct TCP peer (before X-Forwarded-For is applied).
    geo $realip_remote_addr $registreasy_peer_private {
        default         0;
        127.0.0.0/8     1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        100.64.0.0/10   1;
        ::1/128         1;
        fc00::/7        1;
    }
    # The real client (after X-Forwarded-For from a trusted proxy).
    # 100.64.0.0/10 covers carrier-grade NAT and Tailscale-style VPNs.
    geo $remote_addr $registreasy_client_private {
        default         0;
        127.0.0.0/8     1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        169.254.0.0/16  1;
        100.64.0.0/10   1;
        ::1/128         1;
        fc00::/7        1;
        fe80::/10       1;
    }
    map "$registreasy_peer_private:$http_x_forwarded_proto" $registreasy_scheme {
        default         $scheme;
        "~*^1:https"    https;
        "~*^1:http"     http;
    }

    # --- Plain HTTP is for the LAN only ---------------------------------------
    # Passwords and session cookies cross plain HTTP readably. Allow that only
    # for private clients, and not at all when REQUIRE_HTTPS=1. /healthz carries
    # no secrets and stays open for monitors.
    # Generated by entrypoint.sh: $registreasy_role and $registreasy_require_https.
    include /etc/nginx/registreasy-users.conf;

    map $uri $registreasy_https_exempt {
        default   0;
        /healthz  1;
    }
    map "$registreasy_https_exempt:$registreasy_scheme:$registreasy_client_private:$registreasy_require_https" $registreasy_plain_http_denied {
        default      0;
        "0:http:0:0" 1;
        "0:http:0:1" 1;
        "0:http:1:1" 1;
    }

    # --- Rate limits for password-checking routes ----------------------------
    # Per real client, plus an overall cap (LAN clients can forge X-Forwarded-For).
    # Docker pulls/pushes on /v2/ are untouched.
    limit_req_zone $binary_remote_addr zone=registreasy_api_client:10m rate=10r/s;
    limit_req_zone $server_port zone=registreasy_api_all:1m rate=30r/s;
    map $request_method $registreasy_signin_key {
        POST     $binary_remote_addr;
        default  "";
    }
    limit_req_zone $registreasy_signin_key zone=registreasy_signin:10m rate=10r/m;
    limit_req_status 429;

    # Only the publisher may write. Anonymous requests fall through to
    # auth_basic (401 challenge); any other named user gets 403 on writes.
    # auth_basic still verifies the publisher's password after this check.
    map "$request_method:$registreasy_role" $registreasy_deny_write {
        default            1;
        "~^(GET|HEAD):"    0;
        "~:(anon|push)$"   0;
    }

    # Single endpoint: every route needs the pull or push account.
    server {
        listen 5000;
        server_name _;
        client_max_body_size 0;
        default_type text/plain;

        if ($registreasy_plain_http_denied) {
            return 403 "HTTPS is required: this registry only accepts plain HTTP from private (LAN/VPN) addresses.\n";
        }

        # Always challenge at /v2/ so Docker sends credentials on pushes.
        location /v2/ {
            auth_basic "Registreasy";
            auth_basic_user_file /run/registreasy/users.htpasswd;
            if ($registreasy_deny_write) {
                return 403;
            }
            include /etc/nginx/registry-proxy.conf;
        }

        # Health reporting is deliberately available to unauthenticated monitors.
        location = /healthz {
            include /etc/nginx/app-proxy.conf;
        }

        # Landing page and assets are public. The API routes check credentials
        # in inventory.py (no WWW-Authenticate header), so browsers show the
        # page's sign-in form rather than a native Basic-auth popup.
        location = / {
            include /etc/nginx/app-proxy.conf;
        }
        location = /inventory.js {
            include /etc/nginx/app-proxy.conf;
        }
        location = /inventory.css {
            include /etc/nginx/app-proxy.conf;
        }
        location = /api/session {
            limit_except GET POST DELETE { deny all; }
            limit_req zone=registreasy_signin burst=10 nodelay;
            limit_req zone=registreasy_api_client burst=20 nodelay;
            limit_req zone=registreasy_api_all burst=60 nodelay;
            client_max_body_size 4k;
            include /etc/nginx/app-proxy.conf;
        }
        location = /api/inventory {
            limit_except GET { deny all; }
            limit_req zone=registreasy_api_client burst=20 nodelay;
            limit_req zone=registreasy_api_all burst=60 nodelay;
            include /etc/nginx/app-proxy.conf;
        }
        location = /api/delete {
            limit_except POST { deny all; }
            limit_req zone=registreasy_api_client burst=20 nodelay;
            limit_req zone=registreasy_api_all burst=60 nodelay;
            client_max_body_size 4k;
            include /etc/nginx/app-proxy.conf;
        }

        location / {
            return 404;
        }
    }
}
