worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $http_x_forwarded_proto $registry_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Read endpoint: optional authentication, NEVER allow writes.
    server {
        listen 5000;
        server_name _;
        client_max_body_size 0;

        location /v2/ {
            include /etc/nginx/pull-auth.conf;
            limit_except GET {
                deny all;
            }
            include /etc/nginx/registry-proxy.conf;
        }

        location / {
            return 404;
        }
    }

    # Publisher endpoint: GET /v2/ challenges for Basic auth so that Docker
    # recognises credentials and sends them with subsequent blob upload requests.
    server {
        listen 5002;
        server_name _;
        client_max_body_size 0;

        location /v2/ {
            auth_basic "Registreasy publish";
            auth_basic_user_file /run/registreasy/push.htpasswd;
            include /etc/nginx/registry-proxy.conf;
        }

        location / {
            return 404;
        }
    }
}
