worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $http_x_forwarded_proto $registry_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Read endpoint: public when PULL_PASSWORD is blank.
    server {
        listen 5000;
        server_name _;
        client_max_body_size 0;

        location /v2/ {
            include /etc/nginx/pull-auth.conf;
            limit_except GET {
                deny all;
            }
            include /etc/nginx/registry-proxy.conf;
        }

        # Health reporting is deliberately available to unauthenticated monitors.
        location = /healthz {
            proxy_pass http://127.0.0.1:5003/healthz;
        }

        # Inventory and its assets use precisely the same pull credentials.
        location = / {
            include /etc/nginx/pull-auth.conf;
            proxy_pass http://127.0.0.1:5003/;
        }
        location = /api/inventory {
            include /etc/nginx/pull-auth.conf;
            proxy_pass http://127.0.0.1:5003/api/inventory;
        }
        location = /inventory.js {
            include /etc/nginx/pull-auth.conf;
            proxy_pass http://127.0.0.1:5003/inventory.js;
        }
        location = /inventory.css {
            include /etc/nginx/pull-auth.conf;
            proxy_pass http://127.0.0.1:5003/inventory.css;
        }

        location / {
            return 404;
        }
    }

    # Publishing endpoint always requires a challenge at /v2/ so Docker
    # sends credentials with follow-on upload operations.
    server {
        listen 5002;
        server_name _;
        client_max_body_size 0;

        location /v2/ {
            auth_basic "Registreasy publish";
            auth_basic_user_file /run/registreasy/push.htpasswd;
            include /etc/nginx/registry-proxy.conf;
        }

        location / {
            return 404;
        }
    }
}
