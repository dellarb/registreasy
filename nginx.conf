worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Preserve the external HTTPS scheme when behind Nginx Proxy Manager.
    map $http_x_forwarded_proto $registry_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 5000;
        server_name _;

        client_max_body_size 0;
        client_body_timeout 900s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;

        # Only expose the OCI Distribution API; never expose the backend directly.
        location /v2/ {
            include /etc/nginx/registry-auth.conf;

            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $registry_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Authentication is enforced here, not by the internal Registry.
            proxy_set_header Authorization "";
        }

        location / {
            return 404;
        }
    }
}
